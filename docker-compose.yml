# dsh-lan-deploy：DeepSeek Harness 局域网一键部署
# 一条命令：docker compose up -d
# 自动完成：构建 DSH 镜像 → 生成 HTTPS 证书 → 启动 DSH → 启动 HTTPS 反代
# 配置在 .env（复制 .env.example 为 .env 后填写）

services:
  dsh:
    build:
      context: .
      args:
        # npm 源：国内网络构建失败时在 .env 改为 https://registry.npmmirror.com
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: dsh
    restart: unless-stopped
    # host 网络：DSH 枚举到 NAS 真实局域网 IP，自动通过 /api 信任栅栏
    network_mode: host
    # bash 沙箱（bwrap）需要：CAP_SYS_ADMIN 创建 user namespace + 绕过 Docker seccomp
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      # API key：在 .env 填写；或留空，启动后在网页 设置→Models 填写
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # 额外信任域名（空格分隔），如 Tailscale 域名；entrypoint 自动转成 --trusted-host
      - DSH_TRUSTED_HOSTS=${DSH_TRUSTED_HOSTS:-}
    volumes:
      - /mnt/user/appdata/dsh:/data              # DSH_HOME：设置、API key、会话
      - /mnt/user/download/workspace:/workspace  # agent 默认工作目录

  dsh-proxy:
    image: nginx:alpine
    container_name: dsh-proxy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      - dsh

  # 一次性服务：证书不存在时自动生成（幂等，每次 up 都会检查一次）
  dsh-certgen:
    image: alpine:latest
    container_name: dsh-certgen
    restart: "no"
    volumes:
      - ./certs:/certs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /certs/cert.pem ]; then
          # alpine 最小镜像没有 openssl，先装
          apk add --no-cache openssl >/dev/null 2>&1
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /certs/key.pem -out /certs/cert.pem -days 825 \
            -subj "/CN=nas-dsh" 2>/dev/null
          test -f /certs/cert.pem && echo "certificate generated" || echo "CERTGEN FAILED"
        else
          echo "certificate exists, skip"
        fi
