# HTTPS 反代：8443（443 常被 NAS/路由管理界面占用）
# 强制回环身份：DSH 的配置平面（settings/credentials 等特权接口）只信任本机回环，
# 经反代访问必须伪装成回环才能用 Models 页。信任边界 = 反代层（谁能访问 8443）。
server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        # WebSocket 升级转发（对话事件通道 /api/events.mux 必需，否则 426 无响应）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host 127.0.0.1:3080;
        proxy_set_header Origin http://127.0.0.1:3080;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
